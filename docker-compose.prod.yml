services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mikromanager
      POSTGRES_USER: mikromanager
      # Required — set it in the .env file next to this compose file
      # (see .env.example). No insecure default is shipped on purpose.
      # Upgrading from an older compose that defaulted this to "changeme":
      # your postgres volume was initialized with that password, so set
      # DB_PASSWORD=changeme to come back up, then rotate it inside the db
      # container (ALTER USER mikromanager PASSWORD '...') and update .env.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikromanager"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    image: kourtzis/ssh-commander:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://mikromanager:${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}@db:5432/mikromanager
      # Required. Signs the session cookie. Generate: openssl rand -hex 32
      # Rotating it logs every user out; nothing else is affected.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (see .env.example)}
      # Required. AES-256-GCM key for device credentials stored in the DB.
      # Generate: openssl rand -hex 32 — then BACK IT UP somewhere safe.
      # Losing this key permanently bricks every stored device password.
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?set CREDENTIAL_ENCRYPTION_KEY in .env (see .env.example)}
      # Optional: admin password for the account created on very first
      # start (min 8 chars). If empty, a random password is generated and
      # written to a mode-0600 file inside the container — the boot log
      # prints the exact path.
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      PORT: 3000
      NODE_ENV: production
      PUBLIC_DIR: /app/public
      # Session cookie's `Secure` flag. Defaults to `true` (correct when a
      # real HTTPS reverse proxy sits in front and forwards
      # `X-Forwarded-Proto: https`). Set COOKIE_SECURE=false in your .env
      # if you're accessing the app over plain HTTP — otherwise the
      # browser will reject the session cookie and login will loop.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Number of trusted reverse-proxy hops in front of the container.
      # 1 is correct for the typical "single nginx/Caddy/Traefik in front"
      # topology. Set to 0 only if you expose the container directly to
      # the internet with no proxy at all (rare; also disables IP-based
      # rate limiting accuracy).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}

volumes:
  pgdata:
