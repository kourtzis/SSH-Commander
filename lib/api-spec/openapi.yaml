        code: { type: string }
      required: [password]

    # ─── API Tokens (2.0.0) ─────────────────────────────────────────────
    ApiToken:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        username: { type: ["string", "null"] }
        name: { type: string }
        prefix: { type: string }
        scope: { type: string, enum: [read, write] }
        lastUsedAt: { type: ["string", "null"], format: date-time }
        expiresAt: { type: ["string", "null"], format: date-time }
        revokedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
      required: [id, userId, name, prefix, scope, createdAt]
    ApiTokenInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        scope: { type: string, enum: [read, write] }
        expiresDays:
          type: integer
          description: Days until expiry; omit for a non-expiring token
      required: [name, scope]
    ApiTokenCreated:
      type: object
      properties:
        token:
          type: string
          description: Full plaintext token — displayed exactly once at creation
        apiToken:
          $ref: "#/components/schemas/ApiToken"
      required: [token, apiToken]

    # ─── Job Output Analytics (2.0.0) ───────────────────────────────────
    OutputGroup:
      type: object
      properties:
        outputHash: { type: string }
        count: { type: integer }
        routerNames:
          type: array
          items: { type: string }
        taskIds:
          type: array
          items: { type: integer }
        statuses:
          type: array
          items: { type: string }
        sampleOutput: { type: string }
      required: [outputHash, count, routerNames, taskIds, statuses, sampleOutput]
    OutputSearchHit:
      type: object
      properties:
        jobId: { type: integer }
        jobName: { type: string }
        taskId: { type: integer }
        routerName: { type: string }
        routerIp: { type: ["string", "null"] }
        status: { type: string }
        snippet: { type: string }
        createdAt: { type: ["string", "null"], format: date-time }
      required: [jobId, jobName, taskId, routerName, status, snippet]
    OutputSearchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OutputSearchHit"
        total: { type: integer }
      required: [items, total]
