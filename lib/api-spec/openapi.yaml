components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
        totpRequired:
          type: boolean
          description: When true, the password was accepted but a TOTP code must be verified via /auth/totp/verify to complete login
      required:
        - message

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, operator]
        canTerminal:
          type: boolean
          description: Whether this user has access to the per-device terminal. Admins always have access.
        totpEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - role
        - createdAt

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, operator]
        canTerminal:
          type: boolean
      required:
        - username
        - password
        - role

    UpdateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, operator]
        canTerminal:
          type: boolean

    Router:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        ipAddress: { type: string }
        sshPort: { type: integer }
        sshUsername: { type: string }
        description: { type: string }
        credentialProfileId: { type: integer, nullable: true }
        vendor: { type: string, nullable: true }
        osVersion: { type: string, nullable: true }
        lastFingerprintAt: { type: string, format: date-time, nullable: true }
        hasEnablePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
      required:
        - id
        - name
        - ipAddress
        - sshPort
        - sshUsername
        - hasEnablePassword
        - createdAt

    CreateRouterRequest:
      type: object
      properties:
        name: { type: string }
        ipAddress: { type: string }
        sshPort: { type: integer }
        sshUsername: { type: string }
        sshPassword: { type: string }
        enablePassword: { type: string }
        description: { type: string }
        credentialProfileId: { type: integer, nullable: true }
      required:
        - name
        - ipAddress
        - sshPort
        - sshUsername

    UpdateRouterRequest:
      type: object
      properties:
        name: { type: string }
        ipAddress: { type: string }
        sshPort: { type: integer }
        sshUsername: { type: string }
        sshPassword: { type: string }
        enablePassword: { type: string }
        description: { type: string }
        credentialProfileId: { type: integer, nullable: true }

    ImportRoutersRequest:
      type: object
      properties:
        routers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              ipAddress:
                type: string
              sshPort:
                type: integer
              sshUsername:
                type: string
              sshPassword:
                type: string
              description:
                type: string
            required:
              - name
              - ipAddress
      required:
        - routers

    ImportRouterResult:
      type: object
      properties:
        index:
          type: integer
        name:
          type: string
        status:
          type: string
          enum: [created, error]
        error:
          type: string
      required:
        - index
        - name
        - status

    ImportRoutersResponse:
      type: object
      properties:
        created:
          type: integer
        failed:
          type: integer
        total:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/ImportRouterResult"
      required:
        - created
        - failed
        - total
        - results

    RouterGroup:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        parentId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt

    RouterGroupWithMembers:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        parentId:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
        routers:
          type: array
          items:
            $ref: "#/components/schemas/Router"
        subGroups:
          type: array
          items:
            $ref: "#/components/schemas/RouterGroup"
      required:
        - id
        - name
        - createdAt
        - routers
        - subGroups

    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parentId:
          type: integer
          nullable: true
      required:
        - name

    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parentId:
          type: integer
          nullable: true

    AddGroupMemberRequest:
      type: object
      properties:
        type:
          type: string
          enum: [router, group]
        memberId:
          type: integer
      required:
        - type
        - memberId

    RemoveGroupMemberRequest:
      type: object
      properties:
        type:
          type: string
          enum: [router, group]
        memberId:
